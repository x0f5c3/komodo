[package]
name = "komodo_proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "proxy"
path = "src/main.rs"

[dependencies]
komodo_proxy_config = { path = "../../lib/proxy-config" }
pingora-core = { version = "0.9.1", default-features = false, features = ["openssl"] }
pingora-proxy = { version = "0.9.1", default-features = false, features = ["openssl"] }
pingora-http = "0.9.1"
async-trait = "0.1.89"
env_logger = "0.11.8"
log = "0.4.29"
anyhow.workspace = true
arc-swap.workspace = true
serde_json.workspace = true
rustls.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
reqwest = { workspace = true, features = ["http2"] }
tokio-tungstenite.workspace = true
tempfile = "3.26.0"
openssl = "0.10.79"
